services:
  db:
    networks: [backend, outils]
    ports: ["${PORT_DB:-5432}:5432"]

  redis:
    networks: [backend, outils]
    ports: ["${PORT_REDIS:-6379}:6379"]

  # ⚠️ Les images de développement portent un tag distinct.
  # Sans cela, `dev` et `prod` produisent deux images de contenu radicalement
  # différent sous le MÊME nom : basculer d'une configuration à l'autre réutilise
  # l'image en cache et le conteneur meurt en boucle avec un code 127
  # (`npm: not found` sur une image nginx, par exemple).
  migrate:
    build:
      target: dev
    image: ${BACKEND_IMAGE:-entretiens/backend}:dev-local

  api:
    build:
      target: dev
    image: ${BACKEND_IMAGE:-entretiens/backend}:dev-local
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
       "--reload", "--reload-dir", "/app/app"]
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations
      - ./backend/tests:/app/tests
      - ./backend/alembic.ini:/app/alembic.ini:ro
    environment:
      ENVIRONNEMENT: development
      NIVEAU_LOG: DEBUG
    ports: ["${PORT_API:-8000}:8000"]

  web:
    build:
      target: dev
    image: ${FRONTEND_IMAGE:-entretiens/frontend}:dev-local
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    volumes:
      - ./frontend:/app
      # Volume anonyme : masque le node_modules de l'hôte, dont les binaires
      # natifs sont compilés pour macOS et casseraient dans l'image Linux.
      - /app/node_modules
    ports: ["${PORT_WEB_DEV:-5173}:5173"]
    environment:
      # Le navigateur appelle /api ; c'est le serveur Vite qui relaie.
      VITE_API_URL: /api
      # ⚠️ Cible du proxy vue **depuis le conteneur** : `localhost` y désigne le
      # conteneur web lui-même, pas l'API. Sans cette variable, toute requête
      # /api échoue en développement conteneurisé.
      VITE_API_TARGET: http://api:8000

networks:
  outils:
    driver: bridge
