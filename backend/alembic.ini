[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

# Horodatage en tête du nom de fichier : l'ordre lexicographique du dossier
# `versions/` correspond alors à l'ordre chronologique, ce qui rend la lecture
# de l'historique immédiate.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# ⚠️ Volontairement VIDE. L'URL est résolue dans `migrations/env.py` depuis la
# variable d'environnement DATABASE_URL. C'est ce qui permet aux tests
# d'injecter une base jetable sans toucher à l'environnement du processus, et
# évite qu'une URL de production se retrouve écrite en clair dans ce fichier.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
