x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    logging: *logging

  redis:
    logging: *logging

  migrate:
    # `${TAG:?}` fait échouer Compose si TAG n'est pas défini : c'est le
    # garde-fou qui matérialise « jamais latest » (§10.1) au niveau de
    # l'orchestration, et pas seulement dans la CI.
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE est obligatoire}:${TAG:?TAG doit être le SHA de commit}
    pull_policy: always
    logging: *logging

  api:
    image: ${BACKEND_IMAGE:?}:${TAG:?}
    pull_policy: always
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
       "--workers", "4", "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      ENVIRONNEMENT: production
      NIVEAU_LOG: INFO
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging: *logging
    # Aucun volume de code.

  web:
    image: ${FRONTEND_IMAGE:?}:${TAG:?}
    pull_policy: always
    # Le conteneur de production sert le build statique par nginx, sur le port
    # 80. C'est le seul point d'entrée publié de toute la stack.
    ports: ["${PORT_WEB:-8080}:80"]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

volumes:
  pgdata:

